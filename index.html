<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Médias</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora de Médias Escolares</h1>
        
        <div class="formulario">
            <label>Nota 1:</label>
            <input type="number" id="nota1" min="0" max="10" step="0.1"><br>

            <label>Nota 2:</label>
            <input type="number" id="nota2" min="0" max="10" step="0.1"><br>

            <label>Nota 3:</label>
            <input type="number" id="nota3" min="0" max="10" step="0.1"><br>

            <label>Nota 4:</label>
            <input type="number" id="nota4" min="0" max="10" step="0.1"><br>

            <button onclick="calcularMedia()">Calcular</button>
        </div>

        <div id="resultado">
            <!-- O resultado vai aparecer aqui -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
